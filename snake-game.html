<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>像素贪吃蛇</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: #33ff33;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #game-wrapper {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 500px;
    padding: 0 10px;
  }

  #header {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 10px;
  }

  #header .score { color: #33ff33; }
  #header .mode-label { color: #888; font-size: 7px; max-width: 120px; text-align: center; }

  #canvas-container {
    position: relative;
    width: 100%;
    max-width: 500px;
    aspect-ratio: 1 / 1;
    border: 2px solid #33ff33;
    box-shadow: 0 0 20px rgba(51,255,51,0.3), inset 0 0 20px rgba(51,255,51,0.1);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }

  /* CRT scanlines */
  #canvas-container::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.12) 2px,
      rgba(0,0,0,0.12) 4px
    );
    pointer-events: none;
    z-index: 2;
  }

  /* CRT flicker */
  @keyframes flicker {
    0%   { opacity: 0.97; }
    5%   { opacity: 0.95; }
    10%  { opacity: 0.98; }
    15%  { opacity: 0.96; }
    20%  { opacity: 0.99; }
    50%  { opacity: 0.96; }
    80%  { opacity: 0.98; }
    100% { opacity: 0.97; }
  }

  #canvas-container canvas { animation: flicker 0.15s infinite; }

  .overlay-screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.88);
    z-index: 10;
    padding: 10px;
  }

  .menu-title {
    font-size: 24px;
    color: #33ff33;
    text-shadow: 0 0 10px #33ff33, 0 0 20px #33ff33;
    margin-bottom: 10px;
    letter-spacing: 4px;
  }

  .menu-subtitle {
    font-size: 8px;
    color: #888;
    margin-bottom: 30px;
  }

  .mode-btn {
    font-family: 'Press Start 2P', monospace;
    background: transparent;
    border: 1px solid #33ff33;
    color: #33ff33;
    padding: 10px 14px;
    margin: 6px 0;
    font-size: 9px;
    cursor: pointer;
    width: 100%;
    max-width: 360px;
    text-align: left;
    transition: all 0.15s;
    line-height: 1.6;
  }

  .mode-btn:hover, .mode-btn:active {
    background: #33ff33;
    color: #000;
    box-shadow: 0 0 15px rgba(51,255,51,0.5);
  }

  .mode-btn .btn-title {
    font-size: 11px;
    display: block;
    margin-bottom: 4px;
  }

  .mode-btn .btn-desc {
    font-size: 7px;
    opacity: 0.7;
    display: block;
  }

  /* Game Over */
  .go-title {
    font-size: 20px;
    color: #ff3333;
    text-shadow: 0 0 10px #ff3333;
    margin-bottom: 16px;
  }

  .go-score {
    font-size: 12px;
    color: #33ff33;
    margin-bottom: 24px;
  }

  .go-btn {
    font-family: 'Press Start 2P', monospace;
    background: transparent;
    border: 1px solid #33ff33;
    color: #33ff33;
    padding: 10px 16px;
    margin: 6px 0;
    font-size: 9px;
    cursor: pointer;
    width: 100%;
    max-width: 260px;
    transition: all 0.15s;
  }

  .go-btn:hover, .go-btn:active {
    background: #33ff33;
    color: #000;
  }

  .go-btn.secondary {
    border-color: #888;
    color: #888;
  }

  .go-btn.secondary:hover, .go-btn.secondary:active {
    background: #888;
    color: #000;
  }

  /* Upgrade screen */
  .upgrade-title {
    font-size: 14px;
    color: #ffcc00;
    text-shadow: 0 0 10px #ffcc00;
    margin-bottom: 24px;
  }

  .upgrade-btn {
    font-family: 'Press Start 2P', monospace;
    background: transparent;
    border: 1px solid #ffcc00;
    color: #ffcc00;
    padding: 10px 14px;
    margin: 5px 0;
    font-size: 8px;
    cursor: pointer;
    width: 100%;
    max-width: 360px;
    text-align: left;
    transition: all 0.15s;
    line-height: 1.6;
  }

  .upgrade-btn:hover, .upgrade-btn:active {
    background: #ffcc00;
    color: #000;
    box-shadow: 0 0 15px rgba(255,204,0,0.5);
  }

  .upgrade-btn .up-title {
    font-size: 10px;
    display: block;
    margin-bottom: 4px;
  }

  .upgrade-btn .up-desc {
    font-size: 7px;
    opacity: 0.7;
    display: block;
  }

  #rewind-indicator {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    color: #00ccff;
    text-shadow: 0 0 20px #00ccff;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }

  /* Mobile D-Pad */
  #dpad {
    display: none;
    width: 180px;
    height: 180px;
    position: relative;
    margin-top: 12px;
  }

  .dpad-btn {
    position: absolute;
    width: 56px;
    height: 56px;
    background: rgba(51,255,51,0.12);
    border: 1px solid rgba(51,255,51,0.4);
    color: #33ff33;
    font-size: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .dpad-btn:active {
    background: rgba(51,255,51,0.35);
  }

  .dpad-up    { top: 0;   left: 50%; transform: translateX(-50%); border-radius: 8px 8px 0 0; }
  .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); border-radius: 0 0 8px 8px; }
  .dpad-left  { left: 0;  top: 50%; transform: translateY(-50%); border-radius: 8px 0 0 8px; }
  .dpad-right { right: 0; top: 50%; transform: translateY(-50%); border-radius: 0 8px 8px 0; }

  .dpad-center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 56px; height: 56px;
    background: rgba(51,255,51,0.06);
    border: 1px solid rgba(51,255,51,0.2);
    border-radius: 4px;
  }

  #footer {
    width: 100%;
    max-width: 500px;
    padding: 8px 0;
    font-size: 7px;
    color: #555;
    text-align: center;
    line-height: 1.8;
  }

  .glitch-active #canvas-container {
    animation: crt-glitch 0.1s infinite;
  }

  @keyframes crt-glitch {
    0%   { transform: translate(0); }
    20%  { transform: translate(-2px, 1px); }
    40%  { transform: translate(1px, -1px); }
    60%  { transform: translate(-1px, 2px); }
    80%  { transform: translate(2px, 0); }
    100% { transform: translate(0); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Mobile layout */
  @media (max-width: 520px) {
    .menu-title { font-size: 18px; }
    .mode-btn { padding: 8px 10px; font-size: 8px; }
    .mode-btn .btn-title { font-size: 9px; }
    .mode-btn .btn-desc { font-size: 6px; }
    #header { font-size: 8px; padding: 6px 0; }
    #footer { font-size: 6px; }
  }

  @media (pointer: coarse) {
    #dpad { display: block; }
  }
</style>
</head>
<body>

<div id="game-wrapper">
  <div id="header">
    <span class="score" id="score-display">SCORE: 0</span>
    <span class="mode-label" id="mode-display"></span>
    <span class="score" id="food-display"></span>
  </div>

  <div id="canvas-container">
    <canvas id="game" width="500" height="500"></canvas>

    <div id="menu-screen" class="overlay-screen">
      <div class="menu-title">像素蛇</div>
      <div class="menu-subtitle">PIXEL SNAKE</div>
      <button class="mode-btn" onclick="startGame(1)">
        <span class="btn-title">1. 故障像素 + 时间豆</span>
        <span class="btn-desc">CRT 故障闪烁 · 时间回溯豆 · 像素残影 · 障碍物</span>
      </button>
      <button class="mode-btn" onclick="startGame(2)">
        <span class="btn-title">2. 蛇身变关卡 + Roguelike</span>
        <span class="btn-desc">身体固化为墙 · 每5食物选强化 · 自造迷宫 · 障碍物</span>
      </button>
      <button class="mode-btn" onclick="startGame(3)">
        <span class="btn-title">3. 复古混合模式</span>
        <span class="btn-desc">CRT故障 · 时间豆 · 残影 · Roguelike强化 · 障碍物</span>
      </button>
    </div>

    <div id="gameover-screen" class="overlay-screen" style="display:none">
      <div class="go-title">GAME OVER</div>
      <div class="go-score" id="final-score">SCORE: 0</div>
      <button class="go-btn" onclick="startGame(mode)">再来一局</button>
      <button class="go-btn secondary" onclick="backToMenu()">重新选模式</button>
    </div>

    <div id="upgrade-screen" class="overlay-screen" style="display:none">
      <div class="upgrade-title">选择强化</div>
      <div id="upgrade-options"></div>
    </div>

    <div id="rewind-indicator">◀◀ 回溯</div>
  </div>

  <div id="dpad">
    <div class="dpad-btn dpad-up" data-dir="up">▲</div>
    <div class="dpad-btn dpad-down" data-dir="down">▼</div>
    <div class="dpad-btn dpad-left" data-dir="left">◀</div>
    <div class="dpad-btn dpad-right" data-dir="right">▶</div>
    <div class="dpad-center"></div>
  </div>

  <div id="footer">
    方向键/WASD/触屏控制 · ENTER 重来 · G 幽灵穿越<br>
    模式1: 故障+时间豆 &nbsp;|&nbsp; 模式2: 蛇身变墙+强化 &nbsp;|&nbsp; 模式3: 全部混合
  </div>
</div>

<script>
// ─── Constants ───
const COLS = 25, ROWS = 25, CELL = 20;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const menuScreen = document.getElementById('menu-screen');
const gameoverScreen = document.getElementById('gameover-screen');
const upgradeScreen = document.getElementById('upgrade-screen');
const upgradeOptions = document.getElementById('upgrade-options');
const scoreDisplay = document.getElementById('score-display');
const modeDisplay = document.getElementById('mode-display');
const foodDisplay = document.getElementById('food-display');
const finalScore = document.getElementById('final-score');
const rewindIndicator = document.getElementById('rewind-indicator');

const MODE_NAMES = {
  1: '故障像素+时间豆',
  2: '蛇身变关卡+Roguelike',
  3: '复古混合模式'
};

// ─── Game State ───
let gameState = 'MENU';
let mode = 0;
let score = 0;
let snake = [];
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let food = null;
let moveTimer = 0;
let moveInterval = 150;
let obstacles = []; // static wall blocks

// Mode 1 & 3: glitch / time bean / trail
let pathHistory = [];
let timeBean = null;
let glitchTimer = 0;
let glitchActive = false;
let glitchDuration = 0;
let trailRemnants = [];

// Mode 2 & 3: solidify / roguelike / ghost
let solidWalls = [];
let solidifyQueue = [];
let foodCount = 0;
let totalFood = 0;
let upgrades = { ghostUses: 0, scoreMulti: 1 };
let ghostActive = false;
let ghostTimer = 0;

// ─── Grid Helpers ───
function isOccupied(x, y) {
  return snake.some(s => s.x === x && s.y === y);
}

function isObstacle(x, y) {
  return obstacles.some(o => o.x === x && o.y === y);
}

function isSolidWall(x, y) {
  return solidWalls.some(w => w.x === x && w.y === y);
}

function isBlocked(x, y) {
  return isObstacle(x, y) || isSolidWall(x, y);
}

function isOutOfBounds(x, y) {
  return x < 0 || x >= COLS || y < 0 || y >= ROWS;
}

function randomFreeCell() {
  for (let i = 0; i < 2000; i++) {
    const x = Math.floor(Math.random() * COLS);
    const y = Math.floor(Math.random() * ROWS);
    if (!isOccupied(x, y) && !isBlocked(x, y) &&
        !(timeBean && timeBean.x === x && timeBean.y === y) &&
        !(food && food.x === x && food.y === y)) {
      return { x, y };
    }
  }
  return { x: 5, y: 5 };
}

// ─── Obstacle Generation ───
function generateObstacles(count) {
  const obs = [];
  const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
  for (let i = 0; i < count; i++) {
    for (let attempt = 0; attempt < 200; attempt++) {
      const x = Math.floor(Math.random() * COLS);
      const y = Math.floor(Math.random() * ROWS);
      // Keep clear zone around snake start
      if (Math.abs(x - cx) < 5 && Math.abs(y - cy) < 2) continue;
      // Keep edges clear for first few obstacles
      if (i < 4 && (x < 2 || x >= COLS - 2 || y < 2 || y >= ROWS - 2)) continue;
      // No duplicates
      if (obs.some(o => o.x === x && o.y === y)) continue;
      // Not on snake
      if (snake.some(s => s.x === x && s.y === y)) continue;
      obs.push({ x, y });
      break;
    }
  }
  return obs;
}

// ─── Init ───
function startGame(m) {
  mode = m;
  score = 0;
  foodCount = 0;
  totalFood = 0;
  snake = [
    { x: 5, y: Math.floor(ROWS / 2) },
    { x: 4, y: Math.floor(ROWS / 2) },
    { x: 3, y: Math.floor(ROWS / 2) }
  ];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  pathHistory = [];
  trailRemnants = [];
  solidWalls = [];
  solidifyQueue = [];
  timeBean = null;
  glitchTimer = 0;
  glitchActive = false;
  glitchDuration = 0;
  upgrades = { ghostUses: 0, scoreMulti: 1 };
  ghostActive = false;
  ghostTimer = 0;

  // Mode-specific speed
  if (mode === 1) moveInterval = 140;
  else if (mode === 2) moveInterval = 150;
  else moveInterval = 135;

  // Generate obstacles per mode
  const obsCount = mode === 1 ? 15 : mode === 2 ? 10 : 18;
  obstacles = generateObstacles(obsCount);

  food = randomFreeCell();

  menuScreen.style.display = 'none';
  gameoverScreen.style.display = 'none';
  upgradeScreen.style.display = 'none';

  modeDisplay.textContent = MODE_NAMES[mode];
  updateHUD();

  gameState = 'PLAYING';
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function backToMenu() {
  gameState = 'MENU';
  gameoverScreen.style.display = 'none';
  menuScreen.style.display = 'flex';
  document.body.classList.remove('glitch-active');
}

function updateHUD() {
  scoreDisplay.textContent = `SCORE: ${score}`;
  if (mode === 2) {
    foodDisplay.textContent = `${foodCount}/5 强化`;
  } else if (mode === 3) {
    foodDisplay.textContent = `${foodCount}/5`;
  } else {
    foodDisplay.textContent = timeBean ? '时间豆!' : '';
  }
}

// ─── Input (Keyboard) ───
document.addEventListener('keydown', (e) => {
  if (gameState === 'GAMEOVER' && e.key === 'Enter') {
    startGame(mode);
    return;
  }
  if (gameState !== 'PLAYING') return;

  switch (e.key) {
    case 'ArrowUp': case 'w': case 'W':
      if (direction.y !== 1) nextDirection = { x: 0, y: -1 };
      break;
    case 'ArrowDown': case 's': case 'S':
      if (direction.y !== -1) nextDirection = { x: 0, y: 1 };
      break;
    case 'ArrowLeft': case 'a': case 'A':
      if (direction.x !== 1) nextDirection = { x: -1, y: 0 };
      break;
    case 'ArrowRight': case 'd': case 'D':
      if (direction.x !== -1) nextDirection = { x: 1, y: 0 };
      break;
    case 'g': case 'G':
      if ((mode === 2 || mode === 3) && upgrades.ghostUses > 0 && !ghostActive) {
        upgrades.ghostUses--;
        ghostActive = true;
        ghostTimer = 3000;
      }
      break;
  }
});

// ─── Input (Touch D-Pad) ───
document.querySelectorAll('.dpad-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  const handler = (e) => {
    e.preventDefault();
    if (gameState !== 'PLAYING') return;
    switch (dir) {
      case 'up':    if (direction.y !== 1)  nextDirection = { x: 0, y: -1 }; break;
      case 'down':  if (direction.y !== -1) nextDirection = { x: 0, y: 1 };  break;
      case 'left':  if (direction.x !== 1)  nextDirection = { x: -1, y: 0 }; break;
      case 'right': if (direction.x !== -1) nextDirection = { x: 1, y: 0 };  break;
    }
  };
  btn.addEventListener('touchstart', handler, { passive: false });
  btn.addEventListener('mousedown', handler);
});

// ─── Input (Swipe on Canvas) ───
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (gameState !== 'PLAYING') return;
  const t = e.changedTouches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 20) return; // too short

  if (absDx > absDy) {
    if (dx > 0 && direction.x !== -1) nextDirection = { x: 1, y: 0 };
    else if (dx < 0 && direction.x !== 1) nextDirection = { x: -1, y: 0 };
  } else {
    if (dy > 0 && direction.y !== -1) nextDirection = { x: 0, y: 1 };
    else if (dy < 0 && direction.y !== 1) nextDirection = { x: 0, y: -1 };
  }
}, { passive: false });

// ─── Glitch System (Mode 1 & 3) ───
function updateGlitch(dt) {
  glitchTimer += dt;
  if (!glitchActive && glitchTimer > 3500 + Math.random() * 5000) {
    glitchActive = true;
    glitchDuration = 200 + Math.random() * 500;
    glitchTimer = 0;
    document.body.classList.add('glitch-active');
  }
  if (glitchActive) {
    glitchDuration -= dt;
    if (glitchDuration <= 0) {
      glitchActive = false;
      document.body.classList.remove('glitch-active');
    }
  }
}

function drawGlitchEffect() {
  if (!glitchActive) return;
  for (let i = 0; i < 6; i++) {
    const y = Math.random() * canvas.height;
    const h = 2 + Math.random() * 12;
    const shift = (Math.random() - 0.5) * 24;
    try {
      const slice = ctx.getImageData(0, y, canvas.width, h);
      ctx.putImageData(slice, shift, y);
    } catch(e) {}
  }
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height;
    const w = 1 + Math.random() * 6;
    const h = 1 + Math.random() * 3;
    ctx.fillStyle = Math.random() > 0.5
      ? `rgba(51,255,51,${Math.random()*0.5})`
      : `rgba(255,51,51,${Math.random()*0.3})`;
    ctx.fillRect(x, y, w, h);
  }
}

// ─── Trail Remnants (Mode 1 & 3) ───
function updateTrailRemnants(dt) {
  for (let i = trailRemnants.length - 1; i >= 0; i--) {
    trailRemnants[i].opacity -= dt * 0.0008;
    if (trailRemnants[i].opacity <= 0) trailRemnants.splice(i, 1);
  }
}

function drawTrailRemnants() {
  trailRemnants.forEach(t => {
    ctx.fillStyle = `rgba(51,255,51,${t.opacity * 0.15})`;
    ctx.fillRect(t.x * CELL + 2, t.y * CELL + 2, CELL - 4, CELL - 4);
  });
}

// ─── Time Bean (Mode 1 & 3) ───
function maybeSpawnTimeBean() {
  if (!timeBean && Math.random() < 0.007) {
    timeBean = randomFreeCell();
    timeBean.life = 8000 + Math.random() * 5000;
  }
}

function updateTimeBean(dt) {
  if (timeBean) {
    timeBean.life -= dt;
    if (timeBean.life <= 0) timeBean = null;
  }
}

function triggerRewind() {
  if (pathHistory.length < 6) return;
  rewindIndicator.style.opacity = '1';
  setTimeout(() => { rewindIndicator.style.opacity = '0'; }, 600);

  const steps = Math.min(3 + Math.floor(Math.random() * 3), pathHistory.length);
  const rewindPos = pathHistory[pathHistory.length - steps];
  pathHistory.splice(-steps);

  for (let i = 0; i < steps; i++) {
    if (snake.length > 3) snake.pop();
  }
  snake[0] = { ...rewindPos };
}

// ─── Solidify Walls (Mode 2 & 3) ───
function maybeSolidify() {
  if (snake.length > 4) {
    solidifyQueue.push({ ...snake[snake.length - 1], delay: 12 });
  }
}

function updateSolidifyQueue() {
  for (let i = solidifyQueue.length - 1; i >= 0; i--) {
    solidifyQueue[i].delay--;
    if (solidifyQueue[i].delay <= 0) {
      const pos = solidifyQueue[i];
      if (!isOccupied(pos.x, pos.y) && !isObstacle(pos.x, pos.y)) {
        solidWalls.push({ x: pos.x, y: pos.y });
      }
      solidifyQueue.splice(i, 1);
    }
  }
}

function drawWalls() {
  solidWalls.forEach(w => {
    ctx.fillStyle = '#445544';
    ctx.fillRect(w.x * CELL, w.y * CELL, CELL, CELL);
    ctx.fillStyle = '#334433';
    ctx.fillRect(w.x * CELL + 2, w.y * CELL + 2, CELL - 4, CELL - 4);
    ctx.fillStyle = '#2a3a2a';
    ctx.fillRect(w.x * CELL + 4, w.y * CELL + 4, 3, 3);
    ctx.fillRect(w.x * CELL + CELL - 7, w.y * CELL + 4, 3, 3);
    ctx.fillRect(w.x * CELL + 4, w.y * CELL + CELL - 7, 3, 3);
    ctx.fillRect(w.x * CELL + CELL - 7, w.y * CELL + CELL - 7, 3, 3);
  });
}

function drawSolidifyQueue() {
  solidifyQueue.forEach(sq => {
    const flash = Math.sin(Date.now() * 0.01) * 0.3 + 0.3;
    ctx.fillStyle = `rgba(100,150,100,${flash})`;
    ctx.fillRect(sq.x * CELL + 1, sq.y * CELL + 1, CELL - 2, CELL - 2);
  });
}

// ─── Roguelike Upgrades (Mode 2 & 3) ───
function showUpgradeScreen() {
  gameState = 'UPGRADE';
  upgradeScreen.style.display = 'flex';

  const allUpgrades = [
    { title: '加速', desc: '移动速度提升', apply: () => { moveInterval = Math.max(70, moveInterval - 15); } },
    { title: '减速缓行', desc: '移动速度降低，更易操控', apply: () => { moveInterval = Math.min(250, moveInterval + 20); } },
    { title: '墙体消融', desc: '随机移除部分固化墙体和障碍物', apply: () => {
      const count = Math.min(4, solidWalls.length);
      for (let i = 0; i < count; i++) {
        if (solidWalls.length > 0) solidWalls.splice(Math.floor(Math.random() * solidWalls.length), 1);
      }
      const obsCount = Math.min(3, obstacles.length);
      for (let i = 0; i < obsCount; i++) {
        if (obstacles.length > 2) obstacles.splice(Math.floor(Math.random() * obstacles.length), 1);
      }
    }},
    { title: '幽灵穿越', desc: '获得1次穿越自身和墙壁的能力(按G触发)', apply: () => { upgrades.ghostUses += 1; } },
    { title: '双倍积分', desc: '后续食物得分翻倍', apply: () => { upgrades.scoreMulti *= 2; } },
    { title: '瘦身术', desc: '蛇身缩短3节(最少3节)', apply: () => {
      const remove = Math.min(3, snake.length - 3);
      for (let i = 0; i < remove; i++) snake.pop();
    }},
    { title: '清道之路', desc: '移除蛇前方5格内的障碍和墙体', apply: () => {
      const head = snake[0];
      for (let d = 1; d <= 5; d++) {
        const nx = head.x + direction.x * d;
        const ny = head.y + direction.y * d;
        solidWalls = solidWalls.filter(w => !(w.x === nx && w.y === ny));
        obstacles = obstacles.filter(o => !(o.x === nx && o.y === ny));
      }
    }},
    { title: '时间膨胀', desc: '额外回溯豆立刻出现在地图上', apply: () => {
      if (!timeBean) {
        timeBean = randomFreeCell();
        timeBean.life = 12000;
      }
    }}
  ];

  const shuffled = allUpgrades.sort(() => Math.random() - 0.5);
  const choices = shuffled.slice(0, 3);

  upgradeOptions.innerHTML = '';
  choices.forEach((up) => {
    const btn = document.createElement('button');
    btn.className = 'upgrade-btn';
    btn.innerHTML = `<span class="up-title">${up.title}</span><span class="up-desc">${up.desc}</span>`;
    btn.onclick = () => {
      up.apply();
      upgradeScreen.style.display = 'none';
      foodCount = 0;
      updateHUD();
      gameState = 'PLAYING';
      lastTime = performance.now();
      requestAnimationFrame(gameLoop);
    };
    upgradeOptions.appendChild(btn);
  });
}

// ─── Game Over ───
function gameOver() {
  gameState = 'GAMEOVER';
  document.body.classList.remove('glitch-active');
  finalScore.textContent = `SCORE: ${score}`;
  gameoverScreen.style.display = 'flex';
}

// ─── Main Update ───
function update() {
  direction = { ...nextDirection };
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  // Boundary
  if (isOutOfBounds(head.x, head.y)) { gameOver(); return; }

  // Self collision
  if (!ghostActive) {
    for (let i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) { gameOver(); return; }
    }
  }

  // Obstacle / wall collision
  if (!ghostActive && isBlocked(head.x, head.y)) { gameOver(); return; }

  snake.unshift(head);

  // Record path for mode 1 & 3
  if (mode === 1 || mode === 3) {
    pathHistory.push({ ...head });
    if (pathHistory.length > 200) pathHistory.shift();
    trailRemnants.push({ x: head.x, y: head.y, opacity: 0.6 });
  }

  // Check food
  if (food && head.x === food.x && head.y === food.y) {
    score += 10 * upgrades.scoreMulti;
    const usesUpgrade = (mode === 2 || mode === 3);
    if (usesUpgrade) {
      foodCount++;
      totalFood++;
      maybeSolidify();
      if (foodCount >= 5) {
        food = randomFreeCell();
        updateHUD();
        showUpgradeScreen();
        return;
      }
    }
    food = randomFreeCell();
  } else {
    snake.pop();
  }

  // Time bean check (mode 1 & 3)
  if ((mode === 1 || mode === 3) && timeBean && head.x === timeBean.x && head.y === timeBean.y) {
    triggerRewind();
    timeBean = null;
    score += 5;
  }

  // Solidify queue (mode 2 & 3)
  if (mode === 2 || mode === 3) {
    updateSolidifyQueue();
  }

  updateHUD();
}

// ─── Rendering ───
function drawGrid() {
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = 'rgba(51,255,51,0.06)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath(); ctx.moveTo(x * CELL, 0); ctx.lineTo(x * CELL, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath(); ctx.moveTo(0, y * CELL); ctx.lineTo(canvas.width, y * CELL); ctx.stroke();
  }
}

function drawObstacles() {
  obstacles.forEach(o => {
    ctx.fillStyle = '#553333';
    ctx.fillRect(o.x * CELL, o.y * CELL, CELL, CELL);
    ctx.fillStyle = '#442222';
    ctx.fillRect(o.x * CELL + 2, o.y * CELL + 2, CELL - 4, CELL - 4);
    // Brick pattern
    ctx.fillStyle = '#331a1a';
    ctx.fillRect(o.x * CELL + 3, o.y * CELL + 3, 6, 3);
    ctx.fillRect(o.x * CELL + 11, o.y * CELL + 3, 6, 3);
    ctx.fillRect(o.x * CELL + 7, o.y * CELL + 10, 6, 3);
  });
}

function drawSnake() {
  snake.forEach((seg, i) => {
    const alpha = i === 0 ? 1 : 0.85 - (i / snake.length) * 0.3;
    if (ghostActive) {
      ctx.fillStyle = `rgba(100,200,255,${alpha * 0.6})`;
    } else {
      ctx.fillStyle = `rgba(51,255,51,${alpha})`;
    }
    ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);

    // Eyes on head
    if (i === 0) {
      ctx.fillStyle = '#88ff88';
      if (direction.x === 1) { // right
        ctx.fillRect(seg.x * CELL + CELL - 6, seg.y * CELL + 4, 3, 3);
        ctx.fillRect(seg.x * CELL + CELL - 6, seg.y * CELL + CELL - 7, 3, 3);
      } else if (direction.x === -1) { // left
        ctx.fillRect(seg.x * CELL + 3, seg.y * CELL + 4, 3, 3);
        ctx.fillRect(seg.x * CELL + 3, seg.y * CELL + CELL - 7, 3, 3);
      } else if (direction.y === -1) { // up
        ctx.fillRect(seg.x * CELL + 4, seg.y * CELL + 3, 3, 3);
        ctx.fillRect(seg.x * CELL + CELL - 7, seg.y * CELL + 3, 3, 3);
      } else { // down
        ctx.fillRect(seg.x * CELL + 4, seg.y * CELL + CELL - 6, 3, 3);
        ctx.fillRect(seg.x * CELL + CELL - 7, seg.y * CELL + CELL - 6, 3, 3);
      }
    }
  });
}

function drawFood() {
  if (!food) return;
  const fx = food._displayX !== undefined ? food._displayX : food.x;
  const fy = food._displayY !== undefined ? food._displayY : food.y;
  const pulse = 0.8 + Math.sin(Date.now() * 0.005) * 0.2;

  ctx.fillStyle = `rgba(255,51,51,${pulse})`;
  ctx.fillRect(fx * CELL + 3, fy * CELL + 3, CELL - 6, CELL - 6);
  ctx.fillStyle = `rgba(255,150,150,${pulse})`;
  ctx.fillRect(fx * CELL + 6, fy * CELL + 6, CELL - 12, CELL - 12);
}

function drawTimeBean() {
  if (!timeBean) return;
  const pulse = 0.6 + Math.sin(Date.now() * 0.008) * 0.4;
  const fadeOut = timeBean.life < 2000 ? timeBean.life / 2000 : 1;

  ctx.fillStyle = `rgba(0,200,255,${pulse * fadeOut})`;
  ctx.fillRect(timeBean.x * CELL + 2, timeBean.y * CELL + 2, CELL - 4, CELL - 4);
  ctx.fillStyle = `rgba(255,255,255,${pulse * fadeOut * 0.8})`;
  ctx.fillRect(timeBean.x * CELL + 8, timeBean.y * CELL + 5, 4, 2);
  ctx.fillRect(timeBean.x * CELL + 9, timeBean.y * CELL + 7, 3, 4);
}

function drawGhostIndicator() {
  if (!ghostActive) return;
  const flash = Math.sin(Date.now() * 0.01) > 0 ? 0.3 : 0.1;
  ctx.fillStyle = `rgba(100,200,255,${flash})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#64c8ff';
  ctx.font = '8px "Press Start 2P"';
  ctx.textAlign = 'center';
  ctx.fillText('GHOST MODE', canvas.width / 2, 15);
}

function drawGameOverEffect() {
  if (gameState !== 'GAMEOVER') return;
  ctx.fillStyle = `rgba(255,0,0,${0.1 + Math.sin(Date.now() * 0.005) * 0.05})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function render() {
  drawGrid();
  drawObstacles();

  if (mode === 1) {
    drawTrailRemnants();
    drawFood();
    drawTimeBean();
    drawSnake();
    drawGlitchEffect();
  } else if (mode === 2) {
    drawWalls();
    drawSolidifyQueue();
    drawFood();
    drawSnake();
    drawGhostIndicator();
  } else {
    // Mode 3: everything
    drawTrailRemnants();
    drawWalls();
    drawSolidifyQueue();
    drawFood();
    drawTimeBean();
    drawSnake();
    drawGlitchEffect();
    drawGhostIndicator();
  }

  drawGameOverEffect();
}

// ─── Game Loop ───
let lastTime = 0;

function gameLoop(timestamp) {
  if (gameState !== 'PLAYING') {
    render();
    if (gameState === 'GAMEOVER') requestAnimationFrame(gameLoop);
    return;
  }

  const dt = timestamp - lastTime;
  lastTime = timestamp;

  // Glitch (mode 1 & 3)
  if (mode === 1 || mode === 3) {
    updateGlitch(dt);
    updateTrailRemnants(dt);
    updateTimeBean(dt);
    maybeSpawnTimeBean();

    if (glitchActive && food) {
      food._displayX = food.x + (Math.random() - 0.5) * 0.4;
      food._displayY = food.y + (Math.random() - 0.5) * 0.4;
    } else if (food) {
      food._displayX = food.x;
      food._displayY = food.y;
    }
  }

  // Ghost timer (mode 2 & 3)
  if ((mode === 2 || mode === 3) && ghostActive) {
    ghostTimer -= dt;
    if (ghostTimer <= 0) ghostActive = false;
  }

  moveTimer += dt;
  if (moveTimer >= moveInterval) {
    moveTimer = 0;
    update();
  }

  render();
  requestAnimationFrame(gameLoop);
}

// ─── Initial draw ───
drawGrid();
ctx.fillStyle = '#33ff33';
ctx.font = '10px "Press Start 2P"';
ctx.textAlign = 'center';
ctx.fillText('选择模式开始游戏', canvas.width / 2, canvas.height / 2 - 10);
ctx.font = '7px "Press Start 2P"';
ctx.fillStyle = '#666';
ctx.fillText('键盘/触屏/滑动 控制', canvas.width / 2, canvas.height / 2 + 15);
</script>
